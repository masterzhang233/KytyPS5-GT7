name: Tohi-GT7 bug report
description: A crash, freeze, graphics problem or slowdown in Tohi-GT7.
title: "[BUG]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. One problem per report, please, and search the existing issues first.
        See the [Tohi-GT7 documentation](https://github.com/masterzhang233/Tohi-GT7#readme) for the settings the builds are tested with
        and the problems already known.

  - type: input
    id: build
    attributes:
      label: Build
      description: The Tohi-GT7 release you downloaded (copy the complete release name).
      placeholder: "Tohi-GT7 1.0.0 (v1.0.0)"
    validations:
      required: true

  - type: input
    id: pc
    attributes:
      label: PC
      description: CPU, graphics card (and driver version), RAM, Windows version.
      placeholder: "Ryzen 5 5600, RTX 3060 (driver 581.xx), 16 GB, Windows 11"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem
      options:
        - Crash (the emulator closes or shows an error)
        - Freeze (the picture stops, with or without sound)
        - Graphics (missing, wrong or flickering things)
        - Slow (low frame rate)
        - Other
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Where in the game (menu, track, mode, camera), what you did, what you saw, and whether it happens every time.
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: Settings changed
      description: State whether the DLSS checkbox is enabled, your camera and track, and any changed launcher settings (resolution, bindless textures, reflections every other frame, ...). Write "none" if none.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log and screenshots
      description: |
        Use the launcher's diagnostic-package button after a short reproduction and attach the package with any screenshots. Avoid leaving detailed file logging enabled during a long session.
    validations:
      required: false
